<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juels</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body, html { margin:0; padding:0; height:100%; overflow:hidden; background:white; }
    model-viewer { width:100%; height:100vh; background-color: #eee; }
  </style>
</head>
<body>

<model-viewer id="mv"
  src=""
  ar
  ar-modes="scene-viewer webxr quick-look"
  ar-scale="auto"
  ar-placement="floor"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  touch-action="pan-y">
</model-viewer>

<script>
  // ⚠️ PLEASE RENAME YOUR FILE ON YOUR COMPUTER:
  // Change "12_6_2025 (1).glb" to "12_6_2025_v2.glb"
  // Spaces and parentheses break AR intents on Android.
  const models = [
    '11_10_2025.glb',
    '12_6_2025_2.glb', 
    '12_6_2025.glb'
  ];

  const mv = document.getElementById('mv');

  // Error listener to see if AR is failing silently
  mv.addEventListener('error', (error) => {
    console.log("Error detected:", error);
    alert("Error loading model. Make sure you are using HTTPS!");
  });

  const rand = models[Math.floor(Math.random() * models.length)];
  
  // Set source
  mv.src = rand;

  // Wait for the component to be ready before forcing AR checks
  mv.addEventListener('load', () => {
      // Explicitly check if AR is available (Debugging)
      if (mv.canActivateAR) {
          console.log("AR is available!");
      } else {
          console.log("AR is NOT available. Check HTTPS or Device compatibility.");
      }
  });
</script>

</body>
</html>
