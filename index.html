<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Viewer</title>

  <!-- model-viewer (module) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html,body { height:100%; margin:0; font-family: Arial, sans-serif; }
    body { background: #ffffff; display:flex; align-items:center; justify-content:center; }
    .viewer-wrap { width: 100%; height: 100vh; max-width: 1200px; max-height: 100vh; box-sizing: border-box; padding: 12px; }
    model-viewer {
      width: 100%;
      height: calc(100vh - 24px);
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    /* small instructions overlay */
    #hint {
      position: absolute;
      left:12px;
      top:12px;
      background: rgba(255,255,255,0.9);
      padding:6px 10px;
      border-radius:6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-size:13px;
    }
  </style>
</head>
<body>
  <div id="hint">Drag / pinch to rotate & zoom</div>
  <div class="viewer-wrap">
    <!-- Replace the src value with your GLB URL (see instructions below) -->
    <model-viewer id="mv"
      src="https://cdn.jsdelivr.net/gh/Bob-beep-bob/Juels/11_10_2025.glb"
      alt="3D model"
      camera-controls
      touch-action="pan-y"
      environment-image="neutral"
      exposure="1"
      auto-rotate
      shadow-intensity="0.5"
      ar
      style="background: #fff;"
    ></model-viewer>
  </div>
</body>
</html>
