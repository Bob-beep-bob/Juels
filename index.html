<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Juels</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    /* Make html/body fill the viewport */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
    }

    /* Model viewer fills most of the screen but leaves space for AR button */
    model-viewer {
      display: block;
      width: 100%;
      height: 85vh;       /* 90% of viewport height */
      margin: 0 auto;
      background: #fff;
    }
  </style>
</head>
<body>

<model-viewer id="mv"
  src=""
  camera-controls
  auto-rotate
  ar
  touch-action="pan-y">
</model-viewer>

<script>
  const models = [
    '11_10_2025.glb',
    '12_6_2025_2.glb',
    '12_6_2025.glb'
  ];

  const mv = document.getElementById('mv');
  const rand = models[Math.floor(Math.random() * models.length)];

  mv.src = rand;
  mv.load();

  mv.addEventListener('error', (e) => console.error("Model Loading Error:", e));
</script>

</body>
</html>
