<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random 3D Model Viewer</title>

  <!-- model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body, html { margin:0; padding:0; height:100%; overflow:hidden; background:white; }
    model-viewer { width:100%; height:100vh; background:#fff; }
  </style>
</head>
<body>

<!-- Viewer -->
<model-viewer id="mv"
  src=""
  camera-controls
  auto-rotate
  ar
  touch-action="pan-y">
</model-viewer>

<script>
  // List your GLB files in the root of the repo
  const models = [
    '11_10_2025.glb',
    '12_6_2025 (1).glb',
    '12_6_2025.glb'
    // Add more if needed
  ];

  const mv = document.getElementById('mv');
  const rand = models[Math.floor(Math.random() * models.length)];

  // Set the GLB source and reload the viewer
  mv.src = rand;
  mv.load(); // ensures AR button works reliably on Android
</script>

</body>
</html>
