<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random 3D Model Viewer</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body, html { margin:0; padding:0; height:100%; overflow:hidden; background:white; }
    model-viewer { width:100%; height:100vh; background:#fff; }
  </style>
</head>
<body>

<model-viewer id="mv"
  src=""
  camera-controls
  auto-rotate
  ar
  touch-action="pan-y">
</model-viewer>

<script>
  // List your GLB files.
  const models = [
    '11_10_2025.glb',
    '12_6_2025_2.glb', // Renamed file
    '12_6_2025.glb'
    // Add more if needed
  ];

  const mv = document.getElementById('mv');
  const rand = models[Math.floor(Math.random() * models.length)];

  // 1. Set the AR property to ensure the viewer knows its purpose.
  // Setting the property directly is often more reliable than using setAttribute.
  mv.ar = true;

  // 2. Set the GLB source
  mv.src = rand;

  // 3. Reload the viewer (ensures AR compatibility is initialized reliably)
  mv.load(); 
  
  // Optional: Check the console for any errors (press F12 on desktop).
  mv.addEventListener('error', (e) => {
    console.error("Model Loading Error:", e);
    // This will help confirm the file path is 100% correct on GitHub
  });
</script>

</body>
</html>
