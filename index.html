<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Random 3D Model Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: white;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    model-viewer {
      width: 100%;
      max-height: 90vh;  /* leave space for AR button */
      background: #fff;
    }
  </style>
</head>
<body>

<model-viewer id="mv"
  src=""
  camera-controls
  auto-rotate
  ar
  touch-action="pan-y">
</model-viewer>

<script>
  const models = [
    '11_10_2025.glb',
    '12_6_2025_2.glb',
    '12_6_2025.glb'
  ];

  const mv = document.getElementById('mv');
  const rand = models[Math.floor(Math.random() * models.length)];

  mv.src = rand;
  mv.load();

  mv.addEventListener('error', (e) => console.error("Model Loading Error:", e));
</script>

</body>
</html>
