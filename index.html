<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random 3D Model Viewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body, html { margin:0; padding:0; height:100%; overflow:hidden; background:white; }
    model-viewer { width:100%; height:100vh; background:#fff; }
  </style>
</head>
<body>

<model-viewer id="mv"
  src=""
  camera-controls
  auto-rotate
  ar
  touch-action="pan-y">
</model-viewer>

<script>
  // List your GLB files in the root of the repo
  // Note: Spaces in filenames are replaced with %20 to ensure they load
  const models = [
    '11_10_2025.glb',
    '12_6_2025%20(1).glb', 
    '12_6_2025.glb'
  ];

  const mv = document.getElementById('mv');
  const rand = models[Math.floor(Math.random() * models.length)];

  // --- AR FIX ---
  // 1. Explicitly set the AR attribute before loading
  mv.setAttribute('ar', '');

  // 2. Set the GLB source
  mv.src = rand;

  // 3. Reload the viewer
  mv.load(); 
</script>

</body>
</html>
